<!DOCTYPE html>
<html lang="zh-CN">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>共生 · AIGC主题海报</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0f;display:flex;justify-content:center;align-items:center;min-height:100vh;font-family:'PingFang SC','Microsoft YaHei',sans-serif}
.poster{width:600px;height:900px;background:linear-gradient(160deg,#050510 0%,#0d1025 30%,#1a1040 60%,#0a0a18 100%);position:relative;overflow:hidden;border-radius:4px;box-shadow:0 20px 60px rgba(100,80,255,0.2)}

/* Glow orbs */
.orb{position:absolute;border-radius:50%;filter:blur(60px);opacity:0.5}
.orb-1{width:300px;height:300px;background:radial-gradient(circle,#6d5cff 0%,transparent 70%);top:-80px;right:-60px}
.orb-2{width:250px;height:250px;background:radial-gradient(circle,#ff4d8f 0%,transparent 70%);bottom:100px;left:-80px;opacity:0.35}
.orb-3{width:180px;height:180px;background:radial-gradient(circle,#00d4aa 0%,transparent 70%);top:50%;left:50%;transform:translate(-50%,-50%);opacity:0.2}

/* Grid */
.grid{position:absolute;top:0;left:0;width:100%;height:100%;background-image:linear-gradient(rgba(255,255,255,0.03) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,0.03) 1px,transparent 1px);background-size:30px 30px;mask-image:radial-gradient(ellipse at center,black 30%,transparent 70%)}

/* Neural network lines */
.neural{position:absolute;top:0;left:0;width:100%;height:100%}
.neural svg{width:100%;height:100%}

/* Central figure — abstract AI entity */
.central-mask{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:200px;height:200px}
.central-circle{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 40% 40%,rgba(120,100,255,0.3) 0%,rgba(60,40,180,0.1) 50%,transparent 70%);border:1px solid rgba(180,160,255,0.2);position:relative}
.central-circle::before{content:'';position:absolute;inset:20px;border-radius:50%;border:1px solid rgba(180,160,255,0.12)}
.central-circle::after{content:'';position:absolute;inset:50px;border-radius:50%;background:rgba(200,180,255,0.08)}
.central-dot{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);width:8px;height:8px;border-radius:50%;background:#c8b8ff;box-shadow:0 0 20px #a088ff,0 0 40px rgba(160,136,255,0.5)}

/* Floating particles */
.particle{position:absolute;width:3px;height:3px;border-radius:50%;background:#a088ff;box-shadow:0 0 6px #a088ff}
.p1{top:20%;left:25%;animation:float 8s ease-in-out infinite}
.p2{top:30%;right:20%;animation:float 6s ease-in-out 1s infinite}
.p3{top:60%;left:15%;animation:float 7s ease-in-out 2s infinite}
.p4{top:70%;right:25%;animation:float 9s ease-in-out 0.5s infinite}
.p5{top:45%;left:75%;animation:float 5s ease-in-out 3s infinite}
.p6{top:25%;left:60%;animation:float 8.5s ease-in-out 1.5s infinite}
@keyframes float{0%,100%{transform:translateY(0)scale(1);opacity:0.6}50%{transform:translateY(-15px)scale(1.5);opacity:1}}

/* Typography */
.type{position:absolute;z-index:10;width:100%}
.type-top{top:60px;text-align:center}
.type-top .en{font-family:'Georgia',serif;font-size:11px;letter-spacing:8px;color:rgba(200,180,255,0.5);text-transform:uppercase;margin-bottom:24px}
.type-top .cn-main{font-size:52px;font-weight:900;letter-spacing:20px;color:#e8e0ff;line-height:1;margin-bottom:8px}
.type-top .cn-sub{font-size:14px;letter-spacing:10px;color:rgba(180,160,240,0.5)}

.type-mid{top:52%;text-align:center;transform:translateY(-50%)}
.type-mid .big-text{font-size:72px;font-weight:900;letter-spacing:6px;background:linear-gradient(180deg,rgba(200,180,255,0.25) 0%,rgba(120,100,200,0.05) 100%);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;line-height:1}

.type-bottom{top:78%;text-align:center}
.type-bottom .tagline{font-size:13px;letter-spacing:6px;color:rgba(200,180,240,0.4);margin-bottom:16px}
.type-bottom .divider{width:40px;height:1px;background:linear-gradient(90deg,transparent,rgba(160,140,220,0.4),transparent);margin:0 auto 16px}
.type-bottom .info{font-size:10px;letter-spacing:4px;color:rgba(150,140,180,0.35)}
.type-bottom .info span{margin:0 12px}

/* Data stream lines */
.data-line{position:absolute;height:1px;background:linear-gradient(90deg,transparent,rgba(100,140,255,0.15),transparent)}
.dl1{top:38%;left:15%;width:200px;transform:rotate(-5deg)}
.dl2{top:55%;right:10%;width:250px;transform:rotate(3deg)}
.dl3{top:72%;left:20%;width:180px;transform:rotate(-2deg)}
</style>
</head>
<body>
<div class="poster">
  <div class="grid"></div>
  <div class="orb orb-1"></div>
  <div class="orb orb-2"></div>
  <div class="orb orb-3"></div>

  <svg class="neural" viewBox="0 0 600 900">
    <g opacity="0.12" stroke="#8b7cf0" stroke-width="0.5" fill="none">
      <!-- Neural nodes -->
      <circle cx="150" cy="180" r="2" fill="#a088ff"/><circle cx="450" cy="200" r="2" fill="#a088ff"/>
      <circle cx="120" cy="400" r="2" fill="#a088ff"/><circle cx="480" cy="380" r="2" fill="#a088ff"/>
      <circle cx="300" cy="300" r="2" fill="#a088ff"/><circle cx="200" cy="550" r="2" fill="#a088ff"/>
      <circle cx="400" cy="500" r="2" fill="#a088ff"/><circle cx="300" cy="650" r="2" fill="#a088ff"/>
      <circle cx="180" cy="720" r="2" fill="#a088ff"/><circle cx="420" cy="700" r="2" fill="#a088ff"/>
      <circle cx="250" cy="250" r="2" fill="#a088ff"/><circle cx="350" cy="270" r="2" fill="#a088ff"/>
      <circle cx="100" cy="620" r="2" fill="#a088ff"/><circle cx="500" cy="600" r="2" fill="#a088ff"/>
      <!-- Connections -->
      <line x1="150" y1="180" x2="300" y2="300"/><line x1="450" y1="200" x2="300" y2="300"/>
      <line x1="120" y1="400" x2="300" y2="300"/><line x1="480" y1="380" x2="300" y2="300"/>
      <line x1="300" y1="300" x2="200" y2="550"/><line x1="300" y1="300" x2="400" y2="500"/>
      <line x1="200" y1="550" x2="180" y2="720"/><line x1="400" y1="500" x2="420" y2="700"/>
      <line x1="200" y1="550" x2="300" y2="650"/><line x1="400" y1="500" x2="300" y2="650"/>
      <line x1="250" y1="250" x2="300" y2="300"/><line x1="350" y1="270" x2="300" y2="300"/>
      <line x1="100" y1="620" x2="180" y2="720"/><line x1="500" y1="600" x2="420" y2="700"/>
      <line x1="150" y1="180" x2="250" y2="250"/><line x1="450" y1="200" x2="350" y2="270"/>
      <line x1="120" y1="400" x2="100" y2="620"/><line x1="480" y1="380" x2="500" y2="600"/>
    </g>
  </svg>

  <div class="particle p1"></div><div class="particle p2"></div><div class="particle p3"></div>
  <div class="particle p4"></div><div class="particle p5"></div><div class="particle p6"></div>

  <div class="data-line dl1"></div><div class="data-line dl2"></div><div class="data-line dl3"></div>

  <div class="central-mask">
    <div class="central-circle"><div class="central-dot"></div></div>
  </div>

  <div class="type type-top">
    <div class="en">Artificial Intelligence × Design</div>
    <div class="cn-main">共 生</div>
    <div class="cn-sub">人 与 机 器 的 创 意 对 话</div>
  </div>

  <div class="type type-mid">
    <div class="big-text">SYMBIOSIS</div>
  </div>

  <div class="type type-bottom">
    <div class="tagline">A I G C  ·  未 来 设 计  ·  无 限 可 能</div>
    <div class="divider"></div>
    <div class="info"><span>2026</span><span>AI+Design</span><span>Poster Series 01</span></div>
  </div>
</div>
</body>
</html>
